<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>James' Birthday</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
  </style>
</head>
<body class="bg-blue-100 flex flex-col items-center justify-center min-h-screen p-4 text-center">
  <h1 class="text-3xl md:text-5xl font-bold text-blue-900 mb-6">
    this is james website birthday with ma friend
  </h1>

  <img src="jbday.jpeg" alt="James Birthday" class="w-full max-w-md rounded-2xl shadow-xl mb-6" />

  <button
    id="confettiButton"
    class="bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-6 rounded-2xl shadow-lg text-xl transition"
  >
    Confetti
  </button>

  <audio id="yaySound" preload="auto">
    <source src="https://www.soundjay.com/human/sounds/cheering-01.mp3" type="audio/mpeg" />
    Your browser does not support the audio element.
  </audio>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('confettiButton');
      const yaySound = document.getElementById('yaySound');

      button.addEventListener('click', () => {
        button.classList.add('shake');
        setTimeout(() => button.classList.remove('shake'), 400);

        yaySound.currentTime = 0;
        yaySound.play().catch(err => console.warn("Audio playback failed:", err));

        const defaults = {
          spread: 70,
          ticks: 100,
          gravity: 0.9,
          origin: { y: 0.6 },
        };

        function fire(particleRatio, opts) {
          confetti(Object.assign({}, defaults, opts, {
            particleCount: Math.floor(150 * particleRatio)
          }));
        }

        fire(0.25, {
          spread: 26,
          startVelocity: 55,
          colors: ['#bb0000', '#ffffff', '#00bb00', '#0000bb']
        });
        fire(0.2, {
          spread: 60,
          colors: ['#ffb703', '#fb8500', '#219ebc']
        });
        fire(0.35, {
          spread: 100,
          scalar: 0.8,
          shapes: ['circle']
        });
        fire(0.1, {
          spread: 120,
          scalar: 1.2,
          shapes: ['square']
        });
      });
    });
  </script>
</body>
</html>
